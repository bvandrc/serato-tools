[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serato-tools"
version = "6.0.0"
description = "Serato track metadata (cues, beatgrid, etc.) crate, smartcrate, library database, and modification; dynamic beatgrid analysis; and better USB export."
keywords = [
    "serato",
    "serato crate",
    "serato smart crate",
    "serato smartcrate",
    "serato database",
    "serato hotcues",
    "serato cues",
    "serato beatgrid",
    "serato usb",
    "serato usb export",
    "serato usb sync",
]
requires-python = ">= 3.12"
readme = "README.md"
authors = [
    { name = "bvandrc", email = "bvandercar@outlook.com" },
]
license = "MIT"
# crates, smart crates, the database, and USB export need nothing beyond the standard library;
# each extra pulls in what its feature imports, including mutagen, which every track tag reads through
dependencies = []

[project.optional-dependencies]
track_tags = ["mutagen"]
waveform_drawing = [
    "mutagen",
    'pillow>=0; python_version<"3.14"',
    'pillow>=12; python_version>="3.14"',
]
beatgrid_analysis = ["mutagen", "librosa", "numpy"]
all = ["serato-tools[track_tags,waveform_drawing,beatgrid_analysis]"]
dev = ["black", "pylint", "pyright"]

[project.urls]
Homepage = "https://pypi.org/project/serato-tools/"
Repository = "https://github.com/bvandrc/serato-tools"
Issues = "https://github.com/bvandrc/serato-tools/issues"
Changelog = "https://github.com/bvandrc/serato-tools/blob/main/CHANGELOG.md"


[project.scripts]
serato_analyze_beatgrid = "serato_tools.track_beatgrid:main_analyze"
serato_usb_export = "serato_tools.usb_export:main"
serato_smartcrate = "serato_tools.smart_crate:main"
serato_crate = "serato_tools.crate:main"
serato_snap_cues_v2 = "serato_tools.track_cues_v2:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["serato_tools*"]

[tool.black]
line-length = 120

[tool.pyright]
disableBytesTypePromotions = true
# Pyright doesn't read .gitignore, so a stale build/ left behind by `pip install .`
# gets type-checked as a second copy of the source. Setting exclude replaces
# Pyright's defaults, hence __pycache__ and dotted dirs are restated here.
exclude = ["build", "dist", "**/__pycache__", "**/.*"]
