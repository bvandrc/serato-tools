[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serato-tools"
version = "6.0.0"
description = "Serato track metadata (cues, beatgrid, etc.) crate, smartcrate, library database, and modification; dynamic beatgrid analysis; and better USB export."
keywords = [
    "serato",
    "serato crate",
    "serato smart crate",
    "serato smartcrate",
    "serato database",
    "serato hotcues",
    "serato cues",
    "serato beatgrid",
    "serato usb",
    "serato usb export",
    "serato usb sync",
]
requires-python = ">= 3.12"
readme = "README.md"
authors = [
    { name = "bvandrc", email = "bvandercar@outlook.com" },
]
license = "MIT"
# crates, smart crates, the database, and USB export need nothing beyond the standard library;
# each extra pulls in what its feature imports, including mutagen, which every track tag reads through
dependencies = []

[project.optional-dependencies]
track_tags = ["mutagen"]
waveform_drawing = [
    "mutagen",
    'pillow>=0; python_version<"3.14"',
    'pillow>=12; python_version>="3.14"',
]
beatgrid_analysis = ["mutagen", "librosa", "numpy"]
all = ["serato-tools[track_tags,waveform_drawing,beatgrid_analysis]"]
test = ["pytest"]
# the test extra too, so pyright can check the tests' pytest imports; Ruff up to its next minor version, since a minor
# release can change its default rules and its formatting
dev = ["serato-tools[test]", "ruff>=0.17,<0.18", "pyright"]

[project.urls]
Homepage = "https://pypi.org/project/serato-tools/"
Repository = "https://github.com/bvandrc/serato-tools"
Issues = "https://github.com/bvandrc/serato-tools/issues"
Changelog = "https://github.com/bvandrc/serato-tools/blob/main/CHANGELOG.md"


[project.scripts]
serato_analyze_beatgrid = "serato_tools.track_beatgrid:main_analyze"
serato_usb_export = "serato_tools.usb_export:main"
serato_smartcrate = "serato_tools.smart_crate:main"
serato_crate = "serato_tools.crate:main"
serato_snap_cues_v2 = "serato_tools.track_cues_v2:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["serato_tools*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's defaults, plus:
extend-select = [
    "I",  # import order
    "UP",  # newer syntax and the standard library's current names
    "B",  # likely bugs
    "SIM",  # simpler equivalents
    "C4",  # simpler comprehensions
    "PIE",  # unnecessary code
    "PERF",  # slow loops
    "FURB",  # modernizations
    "FLY",  # joins that should be f-strings
    "RSE",  # unnecessary parentheses on raise
    "RET",  # needless assignments and branches around return
    "ERA",  # commented-out code
    "W",  # pycodestyle's warnings
    "LOG",  # logging misuse
    "G",  # logging calls that format their message
    "SLOT",  # subclasses of str, tuple, and namedtuple without __slots__
    "PYI",  # type hints, such as typing.NamedTuple for collections.namedtuple
    "PGH",  # type: ignore and noqa without a rule code
    "PT",  # pytest style, such as pytest.raises without match
    "RUF",  # Ruff's own
    # what pylint checked
    "SLF",  # access to another class's private members
    "ARG",  # unused arguments
    "BLE",  # catching any exception
    "PLE",  # pylint's errors
    "PLW",  # pylint's warnings
    "S102",  # exec
    "S307",  # eval
]
ignore = [
    # takes any UPPER_CASE name for a constant, so it would swap `assert cls.DEFAULT_ENTRIES == default` to put the
    # expected value first
    "SIM300",
    # flags any raise after an isinstance check, but those here are about malformed data or a tag with no audio file,
    # which raise ValueError, not about a caller passing the wrong type
    "TRY004",
    # the parsers convert each field's value in place as they read it, reassigning the loop variable; pylint only
    # checks this in an optional extension
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# tests reach into internals to set up and check state the public API doesn't expose
"test/**" = ["SLF001"]

[tool.ruff.lint.flake8-pytest-style]
# the tests name their parametrize arguments in one string, "a, b, c"
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-unused-arguments]
# a lambda or callback taking `*args` it doesn't use is matching the signature its caller passes
ignore-variadic-names = true

# Groups the imports into the standard library, third-party packages, and this repo's modules, each sorted.
[tool.ruff.lint.isort]
known-first-party = ["serato_tools"]
# the tests' shared helpers, in their own group after the package's imports
known-local-folder = ["test"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.pyright]
disableBytesTypePromotions = true
# Pyright doesn't read .gitignore, so a stale build/ left behind by `pip install .`
# gets type-checked as a second copy of the source. Setting exclude replaces
# Pyright's defaults, hence __pycache__ and dotted dirs are restated here.
exclude = ["build", "dist", "**/__pycache__", "**/.*"]
