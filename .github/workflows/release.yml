name: Release

# Publishing a GitHub release publishes its version to PyPI. Its tag must be "v" + pyproject.toml's version (e.g. v6.0.0).
# PyPI's trusted publisher names this file (release.yml) and the pypi environment, so renaming either means updating it
# there too. The build and release-notes steps are shared actions from bvandrc/bvandrc-conventions; the publish step
# stays here, since trusted publishing matches the workflow file that runs it.
on:
  release:
    types: [published]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # builds and checks the distributions, uploads them, and checks the tag matches their version
      - name: Build
        id: build
        uses: bvandrc/bvandrc-conventions/.github/actions/pypi-build@main

  # in its own job, so only these steps get the publish token
  publish:
    name: "Publish"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/serato-tools/
    permissions:
      contents: write # to fill in the release's notes and attach the distributions to it
      id-token: write # for PyPI's trusted publishing
    steps:
      # for CHANGELOG.md
      - name: Checkout repository
        uses: actions/checkout@v4

      # only for a release published with empty notes, so notes written for it are kept
      - name: Fill in the release notes from the changelog
        uses: bvandrc/bvandrc-conventions/.github/actions/release-notes-from-changelog@main
        with:
          version: ${{ needs.build.outputs.version }}
          version-scheme: pep440

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      # checks the distributions' metadata (twine check) before uploading
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
