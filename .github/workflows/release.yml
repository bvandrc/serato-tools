name: Release

# Publishing a GitHub release publishes its version to PyPI. Its tag must be "v" + pyproject.toml's version (e.g. v6.0.0).
# PyPI's trusted publisher names this file (release.yml) and the pypi environment, so renaming either means updating it
# there too.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: "Build & Publish"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/serato-tools/
    permissions:
      contents: write # to fill in the release's notes and attach the distributions to it
      id-token: write # for PyPI's trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # can't do 3.14 yet due to build issues

      - name: Check the tag matches the version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag is $TAG, but pyproject.toml's version is $version. Its tag must be v$version."
            exit 1
          fi

      - name: Fill in empty release notes from the changelog
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$BODY" ]; then
            echo "The release has notes already, so they're kept."
            exit 0
          fi
          notes=$(.github/scripts/changelog-section.sh "${TAG#v}")
          if [ -z "$notes" ]; then
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}, so the release's notes are left empty."
            exit 0
          fi
          gh release edit "$TAG" --notes "$notes"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach the distributions to the release
        run: gh release upload "$TAG" dist/* --clobber
