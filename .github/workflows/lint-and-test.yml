name: Lint & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # once, on the oldest supported Python: the results don't depend on the OS, and pyright checks against the running
  # version, so 3.12 is what catches use of anything newer
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all,dev]"

    - name: Lint (Pylint)
      run: pylint $(git ls-files '*.py')

    - name: Lint (PyRight)
      uses: jakebailey/pyright-action@v1
      with:
        working-directory: .

    - name: Format Check (Black)
      uses: psf/black@stable

  test:
    name: "Test (${{ matrix.os }}, ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all]"

    - name: Test
      run: python -m unittest
