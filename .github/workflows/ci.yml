name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # on every Python version, since pylint and pyright check against the running one (3.12 catches use of anything newer,
  # later versions catch deprecations and removals), but on one OS, since the results don't depend on it
  lint:
    name: "Lint (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all,dev]"

    - name: Lint (Pylint)
      run: pylint $(git ls-files '*.py')

    - name: Lint (PyRight)
      uses: jakebailey/pyright-action@v1
      with:
        working-directory: .

    # isort's and black's output don't depend on the Python version
    - name: Import Order Check (isort)
      if: matrix.python-version == '3.12'
      run: isort --check-only --diff .

    - name: Format Check (Black)
      if: matrix.python-version == '3.12'
      uses: psf/black@stable

  test:
    name: "Test (${{ matrix.os }}, ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all,test]"

    - name: Test
      run: python -m pytest
