name: Backfill Releases

# One-off: creates a tag and GitHub release for each version published to PyPI before publishing went through releases,
# at the main commit it was built from. Safe to rerun, since it skips versions that have a release, and safe to delete
# once it has run. It doesn't publish anything: a release made with the workflow's token doesn't trigger Build & Publish.
#
# Each version is matched to the commit at the head of main when PyPI received it. Where that commit has another version
# in pyproject.toml (it was published before being committed), it's the first commit after with the version. 1.5.0,
# 1.12.0, 1.14.1, 3.8.0, and 3.8.1 never had a commit with their version, so they get no release.
on:
  workflow_dispatch:

jobs:
  backfill:
    name: "Backfill Releases"
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tags and releases
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the missing releases
        run: |
          # only mark the newest backfilled release latest if no release is yet, e.g. one made since for 6.0.0
          had_latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          # version, commit it was built from, and date PyPI received it, oldest first
          while read -r version sha published; do
            tag="v$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag has a release already, so it's skipped."
              continue
            fi
            notes=$(.github/scripts/changelog-section.sh "$version")
            if [ -z "$notes" ]; then
              notes="No changelog entry for this version; see the commits since the previous release."
            fi
            notes+=$'\n\n'"Published to [PyPI](https://pypi.org/project/serato-tools/$version/) on $published. This release was added afterwards, at the commit it was built from."
            gh release create "$tag" --target "$sha" --title "$tag" --notes "$notes" --latest=false
            last_tag=$tag
          done <<'VERSIONS'
