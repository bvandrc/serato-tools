name: Sync Release Notes

# Rewrites each GitHub release's notes as its version's section of CHANGELOG.md, e.g. after the changelog's entries are
# reworded. A release whose version has no section keeps its notes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the new notes, without changing any release"
        type: boolean
        default: false

permissions:
  contents: write # to edit the releases

jobs:
  sync:
    name: "Sync Release Notes"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync the release notes
        run: python .github/scripts/sync_release_notes.py $DRY_RUN
